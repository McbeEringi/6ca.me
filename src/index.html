<script type="build">
import cfg from'config_default';
import tmpl from'html_tmpl';
import links_csv from'./links.csv';

const links=(await links_csv.text()).split('\n').filter(x=>x).map(x=>x.split(/,\s*/));

export default x=>(
	x=tmpl({
		...cfg,
		title:'6ca.me',
		desc:'McbeEringi HomePage'
	})(x),
	x.html=new HTMLRewriter().on('div#link[class=stuff]',{element:e=>e.append(
		links.map(x=>`<a target="_blank" href="https://${x[0]}/" style="--img:url(${
			x[3]??`../img/links/${x[0].replace(/\//g,'_')}.png`
		})"${x[3]?' class="irp"':''}><p>${x[1]}</p><p>${x[2]}</p></a>\n`).join(''),
		{html:true}
	)}).transform(x.html),
	x
);
</script>
