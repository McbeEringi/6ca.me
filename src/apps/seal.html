<script type="build">
import cfg from'config_default';
import tmpl from'html_tmpl';

export default tmpl({
	...cfg,
	title:'seal',
});
</script>
<style head>
#svg{max-width:100%;height:auto;}
#c{display:none;}
#log{overflow:auto;}
</style>

<h1>seal</h1>
<p>L判(フチ有り)で印刷してシールにするやつ</p>
<hr>

<div class="zab">
	<button id="dlsvg">DL as SVG</button><br>
	<button id="dlpng">DL as PNG</button>
	<details>
		<summary>Images</summary>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label><br>
		<input type="file"><button>clear</button> <label>pixelated:<input type="checkbox"></label>
	</details>
	<pre id="log"></pre>
</div>
<br>

<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="5in" viewBox="0 0 35 49" style="background-color:#ccc" id="svg">
	<desc>5x7 icons</desc>
	<defs>
		<clipPath id="clip"><circle cx="3.5" cy="3.5" r="3.5" id="circle" fill="none"/></clipPath>
		<image width="7" height="7" id="icon0" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon1" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon2" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon3" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon4" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon5" clip-path="url(#clip)"/>
		<image width="7" height="7" id="icon6" clip-path="url(#clip)"/>
		<g id="col">
			<use/>
			<use y="7"/>
			<use y="14"/>
			<use y="21"/>
			<use y="28"/>
			<use y="35"/>
			<use y="42"/>
		</g>
	</defs>
	<use href="#col"/>
	<use href="#col" x="7"/>
	<use href="#col" x="14"/>
	<use href="#col" x="21"/>
	<use href="#col" x="28"/>
</svg>
<canvas id="c" width="2100" height="3000"></canvas>

<script>
onerror=e=>log.textContent+=e+'\n';
onunhandledrejection=e=>log.textContent+=e.reason+'\n';

const
files=document.querySelectorAll('input[type="file"]'),
cb=document.querySelectorAll('input[type="checkbox"]'),
icon=document.querySelectorAll('image[id^=icon]'),
row=document.querySelectorAll('#col>use'),
dl=x=>(a=>URL.revokeObjectURL(a.href=URL.createObjectURL(x),a.download=[...files].filter(x=>x.value).map(x=>x.files[0].name).join('_'),a.click()))(document.createElement('a'));


files.forEach((e,i)=>(
	(e.onchange=async(x={target:e})=>(
		x.target.value?console.log(
			icon[i].href.baseVal=
				await new Promise((f,r)=>Object.assign(new FileReader(),{onload:x=>f(x.target.result),onerror:r}).readAsDataURL(x.target.files[0]))
		):icon[i].removeAttribute('href'),
		[...icon].reduce((a,x,i)=>(x.href.baseVal&&console.log(a=i),row[i].setAttribute('href',`#icon${a}`),a),0)
	))(),
	e.nextElementSibling.onclick=_=>(
		e.value='',e.onchange(),
		cb[i].checked=false,cb[i].onchange()
	)
));

cb.forEach((e,i)=>(
	(e.onchange=(x={target:e})=>(
		x.target.checked?icon[i].style.imageRendering='pixelated':icon[i].removeAttribute('style')
	))()
));


dlsvg.onclick=async x=>dl(new Blob([svg.outerHTML],{type:'image/svg+xml'}));

dlpng.onclick=async x=>(
	x=new Image(),
	log.textContent+=svg.outerHTML,
	x.src=`data:image/svg+xml;base64,${btoa(svg.outerHTML)}`,
	await x.decode(),
	(ctx=>(
		ctx.clearRect(0,0,c.width,c.height),
		ctx.drawImage(x,0,0,c.width,c.height)
	))(c.getContext('2d')),
	dl(await new Promise((f,r)=>c.toBlob(f,r)))
);
</script>
